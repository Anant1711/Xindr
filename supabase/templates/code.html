<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f2f2f7;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Helvetica Neue&quot;,
        sans-serif;
      color: #000;
    "
  >
    <div
      style="
        max-width: 420px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        padding: 24px;
      "
    >
      <p style="margin: 0 0 8px; font-size: 17px">Your sign-in code is</p>
      <p
        style="
          margin: 0 0 16px;
          font-size: 34px;
          font-weight: 700;
          letter-spacing: 6px;
        "
      >
        {{ .Token }}
      </p>
      <p style="margin: 0; font-size: 14px; color: #8a8a8e">
        It expires in one hour. If you didn't ask for this, you can ignore this
        email.
      </p>
    </div>
  </body>
</html>
